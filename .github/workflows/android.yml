name: Gestão ADM - Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Localizar projeto Android
        run: |
          echo "Procurando Gradle Wrapper..."
          find projeto -name gradlew -type f

      - name: Preparar Gradle
        run: |
          chmod +x $(find projeto -name gradlew -type f | head -1)

      - name: Gerar APK
        run: |
          GRADLEW=$(find projeto -name gradlew -type f | head -1)
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GestaoADM-V10-APK
          path: projeto/**/app/build/outputs/apk/debug/*.apk
